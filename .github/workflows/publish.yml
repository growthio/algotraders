name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Release Distributions
        run: |
          python -m pip install build
          python -m build

      # ! must match the download-artifact major below. v4 changed the
      # artifact format, so a v7 upload paired with a v8 download fails
      # to resolve the artifact at publish time - after the build has
      # already succeeded, which is the worst place to find out
      - name: Upload Distributions
        uses: actions/upload-artifact@v8
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    environment:
      name: PyPI Release
      url: https://pypi.org/p/algotraders

    steps:
      - name: Retrieve Release Distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      # ! TODO(security): pin this to a commit SHA rather than a branch.
      # `release/v1` is a MUTABLE branch reference, and this job holds
      # `id-token: write` - whoever controls that branch can mint a
      # trusted-publishing token for this project. Every other action
      # here is at least on an immutable tag
      - name: Publish Release Distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
