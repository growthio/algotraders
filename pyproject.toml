[build-system]
requires = [
    "setuptools==82.0.1",
    "wheel==0.47.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "algotraders"
dynamic = ["version"]
description = "Unified Algorithmic Trading using Broker's API"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "ZenithClown", email = "dpramanik.official@gmail.com"}
]

keywords = [
    "algorithim", "automatic", "trading", "strategy", "market",
    "algotrading", "broker", "api", "automation", "tradingview",
    "alerts", "nse", "bse", "india", "global", "f&o", "futures",
    "options", "options trading", "futures trading", "backtesting",
    "historical data", "exchanges api", "commodities", "fyers", "kite",
    "zerodha", "coin", "groww", "angelone", "tickertape", "screener"
]

classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

# ? pydantic is the only runtime dependency, it carries the normalized
# data contract that the host application consumes directly as a
# FastAPI response model. Broker SDKs stay optional, see extras below.
dependencies = [
    "pydantic>=2.7"
]

[project.optional-dependencies]
# ! install only the broker(s) actually in use, the registry raises
# BrokerConfigurationError naming the missing extra at lookup time
fyers = ["fyers-apiv3>=3.1.7"]
kite = ["kiteconnect>=5.0.1"]

# ? mounting the bundled APIRouter is opt-in, the library core never
# imports fastapi and works fine as a plain importable package
server = ["fastapi>=0.110"]

test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27"
]

dev = [
    "algotraders[server,test]",
    "flake8>=7.0",
    "build>=1.2"
]

all = ["algotraders[fyers,kite,server,test]"]

[project.urls]
Homepage = "https://github.com/growthio/algotraders"
Repository = "https://github.com/growthio/algotraders"
Issues = "https://github.com/growthio/algotraders/issues"

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*"]

[tool.setuptools.dynamic]
version = {attr = "algotraders.__version__"}

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

# ? auto mode removes the need to decorate every coroutine test with
# an explicit @pytest.mark.asyncio marker
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ! deselecting "live" by default is what keeps a stray broker call
# out of both CI and an absent-minded local run
addopts = "-m 'not live' --strict-markers --strict-config"

markers = [
    "live: touches a real broker endpoint, never collected in CI"
]

[tool.coverage.run]
source = ["algotraders"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod"
]
